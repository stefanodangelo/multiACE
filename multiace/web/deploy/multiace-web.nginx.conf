# multiACE Web - nginx location block.
#
# Drop-in for the existing fluidd / mainsail nginx config:
#   /etc/nginx/fluidd.d/multiace-web.conf
# The auth-check.conf shipped by paxx fb-http already exposes
# /auth_check internally; we piggyback on it so multiACE inherits
# the same Moonraker-managed authentication.

location /multiace/ {
    auth_request /auth_check;

    proxy_pass http://127.0.0.1:7126/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade for /multiace/ws
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # WS streams must not be buffered or timed out aggressively
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Preflight uploads (up to MULTIACE_PREFLIGHT_MAX_MB, default 500MB) must
    # stream straight through to the backend instead of being spooled to
    # disk here first - request buffering "on" (nginx's default) means the
    # whole file has to land on this box before FastAPI/the ASGI
    # Content-Length fast-fail ever sees a byte of it, which is most of
    # what made large uploads feel like they "hang" before even reaching
    # the app. 550m gives headroom above the 500MB app-level cap for
    # multipart boundary/field framing overhead.
    proxy_request_buffering off;
    client_max_body_size 550m;
}
